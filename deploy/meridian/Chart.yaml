apiVersion: v2
name: meridian
description: Declarative calendar sync — stateless snapshot reconciliation between CalDAV and Google Calendar, k8s-native.
type: application
home: https://islerfab.github.io/meridian/
icon: https://raw.githubusercontent.com/islerfab/meridian/main/docs/static/images/logo.png
sources:
  - https://github.com/islerfab/meridian
keywords:
  - calendar
  - calendar-sync
  - caldav
  - google-calendar
  - gitops
  - self-hosted
maintainers:
  - name: Fabio Isler
    url: https://github.com/islerfab
# Both are rewritten by `helm package --version --app-version` at release time.
version: 0.1.0
appVersion: "0.1.0"
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  # Searched for alongside the bare name, which several unrelated projects
  # also answer to.
  artifacthub.io/alternativeName: meridian-calendar-sync
  # Drops at v1.0.0, when the rules.yaml schema, the chart values and the CLI
  # stop changing without notice.
  artifacthub.io/prerelease: "true"
  # A link named "support" is the one Artifact Hub highlights.
  artifacthub.io/links: |
    - name: Documentation
      url: https://islerfab.github.io/meridian/
    - name: Get started
      url: https://islerfab.github.io/meridian/get-started/
    - name: Deploy guide
      url: https://islerfab.github.io/meridian/guides/deploy/
    - name: Releases
      url: https://github.com/islerfab/meridian/releases
    - name: Security policy
      url: https://github.com/islerfab/meridian/security/policy
    - name: support
      url: https://github.com/islerfab/meridian/issues
  # APP_VERSION is substituted with the release version before packaging:
  # Artifact Hub scans whatever tag is named here, and `helm package` rewrites
  # appVersion but never annotations.
  artifacthub.io/images: |
    - name: meridian
      image: ghcr.io/islerfab/meridian:APP_VERSION
