apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  # Singleton by design: concurrent same-instance engines race on the same
  # calendars (fetch->diff->write is not safe under concurrency), so the
  # replica count is deliberately not a value. Recreate guarantees the old
  # pod dies before the new one starts on rollouts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "meridian.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingConfigMap }}
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "meridian.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: meridian
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - --config=/etc/meridian/rules.yaml
            - --listen=[::]:{{ .Values.listen.port }}
          envFrom:
            - secretRef:
                name: {{ required "credentials.existingSecret is required: a Secret whose keys are the env var names referenced by rules.yaml" .Values.credentials.existingSecret }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
          # Liveness is up as soon as the listener binds; readiness stays
          # false until the startup auth probes pass (before which meridian
          # has touched no calendar, by design).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/meridian
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "meridian.configMapName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
