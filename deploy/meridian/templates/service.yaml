apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # Keep a never-ready pod scrapeable: failing auth probes hold readiness
  # false, and that is exactly when fetch_errors_total matters.
  publishNotReadyAddresses: {{ .Values.service.publishNotReadyAddresses }}
  selector:
    {{- include "meridian.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.listen.port }}
      targetPort: http
      protocol: TCP
