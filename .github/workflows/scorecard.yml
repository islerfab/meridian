name: Scorecard

on:
  schedule:
    - cron: "41 6 * * 1"
  # branch_protection_rule is what keeps the score honest: the checks that
  # depend on repository settings change without anyone touching a file, so a
  # push trigger would never notice.
  branch_protection_rule:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write # signs the results so the badge can trust them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is what makes the README badge resolve; without it the
          # score exists only in this repository's security tab.
          publish_results: true
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
