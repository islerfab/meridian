name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; the release job widens it for itself. A workflow-level
# write grant would apply to every job any future edit adds here.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # keyless cosign trades this for a Fulcio certificate
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: GoReleaser derives the version and changelog
          # range from git describe.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # No cosign-release input on purpose. The installer bakes in a bootstrap
      # cosign version and its SHA256 per platform; asking for that exact
      # version is the one path that verifies against the digest and stops.
      # Any other value makes it fetch the bootstrap anyway and check the
      # request against it, and the version becomes a pin no bot can see.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to ghcr.io (ko pushes via docker credentials)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance: what was built, from which source, by which workflow.
      # Complementary to the cosign signatures above, which say the artifact is
      # unmodified but not where it came from.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/digests.txt
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Publish Helm chart as an OCI artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/meridian --version "$VERSION" --app-version "$VERSION" --destination /tmp/chart-out
          helm push "/tmp/chart-out/meridian-$VERSION.tgz" oci://ghcr.io/islerfab/charts
