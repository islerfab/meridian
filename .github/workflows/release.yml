name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the release job widens it for itself. A workflow-level
# write grant would apply to every job any future edit adds here.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # keyless cosign trades this for a Fulcio certificate
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: GoReleaser derives the version and changelog
          # range from git describe.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Dispatched runs cut their own tag and then carry on into the release
      # below. They cannot hand off to the push trigger above: a tag pushed
      # with GITHUB_TOKEN deliberately does not start another workflow, and the
      # way around that is a long-lived admin PAT in the secrets.
      - name: Cut the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          current="$(go tool svu current)"
          # .svu.yml sets always:true, so `next` differs from `current` even
          # when nothing has landed. Count commits instead, or this tags a
          # second version on an identical tree.
          if [ -z "$(git log "$current"..HEAD --oneline)" ]; then
            echo "No commits since $current — nothing to release." >&2
            exit 1
          fi
          next="$(go tool svu next)"
          # Annotated, to match the tags `task release` cuts. Unsigned either
          # way: the runner has no key, so a tag cut from the Actions tab
          # carries no signature even when local tags do.
          git tag -m "$next" "$next"
          git push origin "$next"
          echo "Tagged $next"

      # No cosign-release input on purpose. The installer bakes in a bootstrap
      # cosign version and its SHA256 per platform; asking for that exact
      # version is the one path that verifies against the digest and stops.
      # Any other value makes it fetch the bootstrap anyway and check the
      # request against it, and the version becomes a pin no bot can see.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to ghcr.io (ko pushes via docker credentials)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance: what was built, from which source, by which workflow.
      # Complementary to the cosign signatures above, which say the artifact is
      # unmodified but not where it came from.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest-binaries
        with:
          subject-checksums: ./dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest-image
        with:
          subject-checksums: ./dist/digests.txt
      # The attestations above live in GitHub's attestation store, which needs
      # an API call to reach. Attaching them to the release makes provenance
      # verifiable from the downloaded files alone. Each is a sigstore bundle
      # wrapping an in-toto statement, one JSON object per line.
      #
      # The `.intoto.jsonl` suffix is load-bearing rather than decorative:
      # Scorecard's Signed-Releases check reads release assets only and matches
      # provenance by filename suffix, so the attestation store is invisible to
      # it. Teaching it to read GitHub attestations is open as
      # ossf/scorecard#4080, #4174 and #4667; these two uploads can go if that
      # ever ships.
      - name: Attach the provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          binaries="/tmp/meridian_${VERSION}_provenance.intoto.jsonl"
          image="/tmp/meridian_${VERSION}_image_provenance.intoto.jsonl"
          cp -f "${{ steps.attest-binaries.outputs.bundle-path }}" "$binaries"
          cp -f "${{ steps.attest-image.outputs.bundle-path }}" "$image"
          gh release upload "$GITHUB_REF_NAME" "$binaries" "$image" --clobber
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Publish Helm chart as an OCI artifact
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          # helm package rewrites version and appVersion but never annotations,
          # and Artifact Hub scans the image tag named in this one.
          sed -i "s|ghcr.io/islerfab/meridian:APP_VERSION|ghcr.io/islerfab/meridian:$VERSION|" deploy/meridian/Chart.yaml
          helm package deploy/meridian --version "$VERSION" --app-version "$VERSION" --destination /tmp/chart-out
          helm push "/tmp/chart-out/meridian-$VERSION.tgz" oci://ghcr.io/islerfab/charts 2>&1 | tee /tmp/chart-push.log
          echo "CHART_DIGEST=$(awk '/^Digest: /{print $2}' /tmp/chart-push.log)" >> "$GITHUB_ENV"

      # By digest, for the same reason the image is: a tag can be moved later,
      # a digest can't.
      - name: Sign the chart
        run: cosign sign --yes "ghcr.io/islerfab/charts/meridian@${CHART_DIGEST}"

      # Proves to Artifact Hub that this repository owns the listing. Republished
      # every release so the tag survives a registry that loses it, and because
      # a one-time manual push is a thing nobody remembers a year later.
      - name: Publish the Artifact Hub ownership metadata
        run: |
          set -euo pipefail
          # oras reads ~/.docker/config.json, which the ko login step wrote.
          # The layer is named by the file, so it is pushed from its own directory.
          mkdir -p /tmp/artifacthub && cp -f deploy/artifacthub-repo.yml /tmp/artifacthub/
          cd /tmp/artifacthub
          go run oras.land/oras/cmd/oras@v1.3.4 push \
            ghcr.io/islerfab/charts/meridian:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
