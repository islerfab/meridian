name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A cache key of this job's own. A key is saved only once, by the
          # first job to finish, and on the default key that is CodeQL, whose
          # cache holds none of Task, Hugo or the race-enabled test builds.
          # The Taskfile is in it for the Hugo pin.
          cache-dependency-path: |
            go.sum
            Taskfile.yml
      # Installed through the action rather than curl-piped-to-shell, which is
      # unpinnable by nature. The version has to understand the Go that
      # setup-go installs: too old and it refuses the config or fails to read
      # the stdlib's export data, which a patch release can change. Raising
      # the go directive, even by a patch, means revisiting this line.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Install only: the Taskfile runs the linter, so CI and a local
          # `task ci` stay the same command rather than drifting apart.
          install-only: true
      # The Helm that packages the chart at release time, rather than whichever
      # one the runner image happens to ship. Renovate moves both pins together.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: vet, lint, test, build
        run: go tool task ci

  # What a release builds, without publishing or signing: both architectures,
  # the archives, and the ko images on the pinned base. Otherwise the release
  # tooling only ever ran on a tag, and a GoReleaser, ko or base image update
  # would first fail in the middle of a release. A job of its own so it runs
  # beside the tests rather than after them.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The snapshot version is derived from the latest tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Shared with release.yml, which builds the same thing.
          cache-dependency-path: |
            go.sum
            .goreleaser.yaml
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          # A snapshot publishes nothing: ko loads the images into the runner's
          # Docker daemon instead of pushing them. Signing is skipped because it
          # needs the OIDC token only the release job is granted.
          args: release --snapshot --clean --skip=sign
