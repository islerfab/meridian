name: Security

# Not redundant with CI, which only fires on push and so catches nothing
# during a quiet month. The case that matters is a stdlib advisory, where the
# fix is a Go toolchain bump — something no dependency bot does.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool task vuln

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # `go test` alone only replays the seed corpus, which makes the targets
      # regression tests rather than fuzzers. This is where they actually
      # search. A failure writes the input under testdata/fuzz — commit it, and
      # it becomes a seed that every future CI run checks.
      - run: go tool task fuzz
